name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 for `zlib.zstdDecompressSync`, which the behavioural verifier uses
          # to read a session log. It exists from 22.15 on, but pinning the major
          # keeps this workflow independent of which 22.x the runner ships.
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # The verifier cannot audit a real session in CI (there is none), but its
      # self-test proves the assertions still reject a broken composition.
      - run: node scripts/verify-session.mjs --self-test
